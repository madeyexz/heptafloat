name: Release

# Push a vX.Y.Z tag that matches VERSION in build.sh. This builds HeptaFloat, signs it with the
# Developer ID certificate, has Apple notarize it, and makes a draft release with the zip.
# Write the release notes on the draft and publish it; the updater ignores drafts until then.
# Run it by hand (Actions → Release → Run workflow) to check signing and notarization without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Check the tag matches build.sh
        run: |
          version=$(sed -n 's/^VERSION=//p' build.sh)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG doesn't match VERSION=$version in build.sh."; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Set up Developer ID signing and notarization
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for name in P12_BASE64 P12_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!name}" ] || { echo "::error::Signing secret for $name is missing."; exit 1; }
          done

          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          # shellcheck disable=SC2046 # one word per keychain path
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/notary.p8"

          {
            echo "SIGN_IDENTITY=Developer ID Application"
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8"
            echo "NOTARY_KEY_ID=$ASC_KEY_ID"
            echo "NOTARY_ISSUER_ID=$ASC_ISSUER_ID"
          } >> "$GITHUB_ENV"
      - run: ./build.sh
      - name: Check the signature
        run: |
          codesign --verify --deep --strict --verbose=2 build/HeptaFloat.app
          spctl --assess --type execute --verbose=2 build/HeptaFloat.app
          xcrun stapler validate build/HeptaFloat.app
      - if: github.ref_type == 'tag'
        run: gh release create "$TAG" "dist/HeptaFloat-$VERSION.zip" --draft --title "HeptaFloat $VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
